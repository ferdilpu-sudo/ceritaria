<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0f" />
  <title>Offline | Ceritaria</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0b0b0f;color:#f5f5f7;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100dvh;display:grid;place-items:center;padding:24px;padding-top:max(24px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom))}.card{width:min(100%,420px);text-align:center}.mark{width:64px;height:64px;margin:0 auto 22px;border-radius:20px;display:grid;place-items:center;background:#16161d;border:1px solid #30303a;color:#e50914;font-size:28px;font-weight:900}.brand{font-size:12px;letter-spacing:.2em;font-weight:900;color:#ff5660}h1{margin:10px 0 0;font-size:28px;line-height:1.1}p{margin:14px auto 0;max-width:340px;color:#a8a8b3;font-size:14px;line-height:1.65}button{margin-top:24px;min-height:48px;border:0;border-radius:14px;background:#e50914;color:#fff;padding:0 22px;font:inherit;font-weight:800;cursor:pointer}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">C</div>
    <div class="brand">CERITARIA</div>
    <h1>Tidak ada koneksi internet</h1>
    <p>Ceritaria membutuhkan internet untuk membuka cerita dan memutar episode. Periksa koneksi, lalu coba lagi.</p>
    <button type="button" onclick="location.reload()">Coba Lagi</button>
  </main>
</body>
</html>
